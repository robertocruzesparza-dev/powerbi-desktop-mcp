name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        # "" = newest mcp allowed by pyproject; the pin is the oldest supported release.
        mcp-pin: ["", "mcp[cli]==2.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pin the oldest supported mcp
        if: matrix.mcp-pin != ''
        run: python -m pip install "${{ matrix.mcp-pin }}"
      - name: Check the console command starts
        run: powerbi-desktop-mcp --version
      - name: Tests
        run: python -m unittest discover -s copilot/tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
